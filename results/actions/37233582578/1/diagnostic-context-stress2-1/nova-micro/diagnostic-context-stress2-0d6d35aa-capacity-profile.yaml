  burst_protocol: false
  metrics_version: 1
  stream: true
  descriptive_bin_s: 30
  metric_definitions:
    latency: successful scheduled cohort, including drain; missing values excluded
      with n reported
    e2e_ms: SDK invocation to response/stream completion; excludes executor queueing
    tpot_ms: (stream completion - first text) / (output tokens - 1); existing SLO
      definition
    text_decode_tpot_ms: (last text - first text) / (output tokens - 1); descriptive,
      no SLO gate
    throughput: successful completions inside window / window seconds; tokens from
      provider usage
    attempted_rps: SDK calls started inside window / window seconds
    reliability: all requests scheduled inside window, including drain outcomes
    outstanding: time-weighted mean and peak clipped to window; queue-inclusive and
      SDK calls separate
    max_inflight: null means no explicit in-flight cap for open-loop rate runner
    bins: descriptive only; no additional hypothesis tests
